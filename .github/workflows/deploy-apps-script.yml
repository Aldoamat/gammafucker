# Deploy automatico dell'Apps Script a ogni push su main che tocca apps-script/.
# Le credenziali clasp stanno nel secret CLASPRC_JSON (contenuto di ~/.clasprc.json
# del PC dove è stato fatto "clasp login"). L'ID del deployment viene da release.config.json.
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'release.config.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa clasp
        run: npm install -g @google/clasp@3

      - name: Credenziali clasp
        run: |
          if [ -z "${{ secrets.CLASPRC_JSON }}" ]; then
            echo "::error::Secret CLASPRC_JSON mancante (Settings → Secrets and variables → Actions)"; exit 1; fi
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: clasp push
        working-directory: apps-script
        run: clasp push -f

      - name: clasp deploy (stesso ID → stesso URL /exec)
        run: |
          ID=$(node -p "require('./release.config.json').deploymentId")
          VER=$(grep -o 'GammaFucker v[0-9]*' index.html | head -1 | tr -d ' ')
          if [ -z "$ID" ]; then echo "::error::deploymentId vuoto in release.config.json"; exit 1; fi
          cd apps-script && clasp deploy -i "$ID" -d "${VER:-release} ${GITHUB_SHA::7}"
